<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile | RW PC Trading</title>
    <link rel="icon" href="assets/images/logo.jpg" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div id="site-header"></div>
    <main class="page">
      <div class="container">
        <div class="section-title">
          <div>
            <h3>My Profile</h3>
            <p class="muted">Manage account details, reservations, and saved PC builds.</p>
          </div>
        </div>
        <div id="app-notice"></div>
        <div class="grid grid-2">
          <form class="card" id="profile-form">
            <h4>Account Settings</h4>
            <label class="field">
              <span>Name</span>
              <input name="full_name" required />
            </label>
            <label class="field">
              <span>Email</span>
              <input name="email" disabled />
            </label>
            <label class="field">
              <span>Phone</span>
              <input name="phone" />
            </label>
            <label class="field">
              <span>Profile Image</span>
              <input type="file" name="avatar" accept="image/*" />
            </label>
            <button class="btn btn-primary" type="submit">Update Profile</button>
          </form>
          <div class="card">
            <h4>Saved PC Builds</h4>
            <div id="saved-builds"></div>
          </div>
        </div>
        <div class="section-title">
          <h3>Recent Reservations</h3>
        </div>
        <div id="profile-reservations"></div>
      </div>
    </main>
    <div id="site-footer"></div>
    <script type="module" src="js/pages/profile.js"></script>
  </body>
</html>
