<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Products | RW PC Trading</title>
    <link rel="icon" href="assets/images/logo.jpg" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div id="site-header"></div>
    <main class="page">
      <div class="container">
        <div class="section-title">
          <div>
            <h3>Products</h3>
            <p class="muted">Browse real inventory status. Exact quantities are reserved for staff.</p>
          </div>
        </div>
        <div id="app-notice"></div>
        <div class="toolbar card">
          <div class="left">
            <input id="product-search" placeholder="Search products..." />
            <select id="category-filter">
              <option value="">All categories</option>
            </select>
          </div>
          <div class="right">
            <a class="btn btn-muted" href="cart.html">View Cart</a>
          </div>
        </div>
        <div class="grid grid-4" id="products-grid" style="margin-top:1rem;"></div>
      </div>
    </main>
    <div class="modal" id="product-modal"></div>
    <div class="modal" id="inquiry-modal"></div>
    <div id="site-footer"></div>
    <script type="module" src="js/pages/products.js"></script>
  </body>
</html>
