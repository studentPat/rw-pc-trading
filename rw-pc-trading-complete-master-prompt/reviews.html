<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reviews | RW PC Trading</title>
    <link rel="icon" href="assets/images/logo.jpg" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div id="site-header"></div>
    <main class="page">
      <div class="container">
        <div class="section-title">
          <div>
            <h3>Customer Reviews</h3>
            <p class="muted">Logged-in customers can submit reviews for admin approval.</p>
          </div>
        </div>
        <div id="app-notice"></div>
        <div class="grid grid-2">
          <form class="card" id="review-form">
            <h4>Leave a Review</h4>
            <label class="field">
              <span>Rating</span>
              <select name="rating" required>
                <option value="5">5 Stars</option>
                <option value="4">4 Stars</option>
                <option value="3">3 Stars</option>
                <option value="2">2 Stars</option>
                <option value="1">1 Star</option>
              </select>
            </label>
            <label class="field">
              <span>Message</span>
              <textarea name="message" required></textarea>
            </label>
            <label class="field">
              <span>Proof Image</span>
              <input type="file" name="proof" accept="image/*" />
            </label>
            <button class="btn btn-primary" type="submit">Submit Review</button>
          </form>
          <div id="reviews-list" class="grid"></div>
        </div>
      </div>
    </main>
    <div id="site-footer"></div>
    <script type="module" src="js/pages/reviews-page.js"></script>
  </body>
</html>
