<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cart | RW PC Trading</title>
    <link rel="icon" href="assets/images/logo.jpg" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div id="site-header"></div>
    <main class="page">
      <div class="container">
        <div class="section-title">
          <div>
            <h3>Your Cart</h3>
            <p class="muted">Stock is validated again before a reservation is submitted.</p>
          </div>
        </div>
        <div id="app-notice"></div>
        <div class="grid grid-2">
          <div id="cart-items"></div>
          <form class="card" id="reservation-form">
            <h4>Submit Reservation</h4>
            <p class="muted">Pickup-only reservation. Required deposit is automatically calculated at 20% of the cart total.</p>
            <label class="field">
              <span>Notes</span>
              <textarea name="notes" placeholder="Preferred pickup date or other details"></textarea>
            </label>
            <div class="notice info" id="cart-total">Cart total: PHP 0.00</div>
            <div class="notice info" id="cart-deposit">Required deposit: PHP 0.00</div>
            <button class="btn btn-primary" type="submit">Create Reservation</button>
          </form>
        </div>
      </div>
    </main>
    <div id="site-footer"></div>
    <script type="module" src="js/pages/cart.js"></script>
  </body>
</html>
