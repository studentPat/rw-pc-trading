<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Account | RW PC Trading</title>
    <link rel="icon" href="assets/images/logo.jpg" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div id="site-header"></div>
    <main class="page auth-shell">
      <form class="auth-card" id="register-form">
        <h3>Create Customer Account</h3>
        <div id="app-notice"></div>
        <label class="field">
          <span>Full Name</span>
          <input name="fullName" required autocomplete="name" />
        </label>
        <label class="field">
          <span>Phone Number</span>
          <input name="phone" required autocomplete="tel" />
        </label>
        <label class="field">
          <span>Email</span>
          <input type="email" name="email" required autocomplete="email" />
        </label>
        <label class="field">
          <span>Password</span>
          <input type="password" name="password" required minlength="6" autocomplete="new-password" />
        </label>
        <button class="btn btn-primary" type="submit">Create Account</button>
        <p class="muted">Already registered? <a href="login.html">Login here</a>.</p>
      </form>
    </main>
    <div id="site-footer"></div>
    <script type="module" src="js/pages/register.js"></script>
  </body>
</html>
